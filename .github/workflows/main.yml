name: CFB Autonomous Engine
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Execute
        run: python main.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Persist State
        run: |
          git config --global user.name 'CFB-Bot'
          git config --global user.email 'bot@cfb.ai'
          git add data/*.json profiles/*.json processed_games.log
          git commit -m "Engine Self-Correction [$(date)]" || echo "No changes"
          git push
