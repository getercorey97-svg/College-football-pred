name: CFB Autonomous Engine
on:
  schedule:
    - cron: '0 10 * * *' # Daily at 10 AM
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: pip install -r requirements.txt

      - name: Execute Engine
        run: python main.py

      - name: Persist State
        run: |
          git config --global user.name 'CFB-Bot'
          git config --global user.email 'bot@cfb.ai'
          git add data/state.json profiles/*.json processed_games.log
          git commit -m "Self-Correction Update [$(date)]" || echo "No changes"
          git push
